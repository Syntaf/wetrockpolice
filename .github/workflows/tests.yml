name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: wrp
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Ruby & Bundle Install
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.13.1

      - name: Configure Yarn Cache Location
        id: cache-locations
        run: |
          echo "yarn_dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Check Yarn Cache
        id: cache-yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.cache-locations.outputs.yarn_dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Install Javascript Packages
        run: |
          yarn install --pure-lockfile

      # esbuild bundle + both sass builds (app and rails_admin) into
      # app/assets/builds, served by Propshaft in the test env. Invoked
      # directly with yarn rather than via javascript:build/css:build because
      # cssbundling-rails runs `bun install`/`bun run build:css` whenever a
      # bun binary exists alongside yarn.lock (GitHub runners ship bun), and
      # that first bun install writes bun.lockb, which flips jsbundling-rails
      # (lockfile-first tool detection) onto bun too. yarn.lock is this
      # repo's single source of dependency truth, so bun must never run.
      - name: Build Assets
        run: |
          yarn build && yarn build:css

      - name: Create Database
        env:
          POSTGRES_TEST_DB: wetrockpolice_test
          POSTGRES_USER: wrp
          POSTGRES_PASSWORD: dev
          POSTGRES_HOST: localhost
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          bundle exec rake db:create
          bundle exec rake db:migrate

      # Nothing else in CI eager loads: test and development both set
      # config.eager_load = false, so production would otherwise be the first
      # boot to load every app class and engine under the reduced framework set
      # from config/application.rb. zeitwerk:check calls
      # Zeitwerk::Loader.eager_load_all regardless of the env's eager_load
      # setting, which is exactly that failure mode.
      - name: Check Eager Loading
        env:
          POSTGRES_TEST_DB: wetrockpolice_test
          POSTGRES_USER: wrp
          POSTGRES_PASSWORD: dev
          POSTGRES_HOST: localhost
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          bundle exec rails zeitwerk:check

      # SKIP_JS_BUILD/SKIP_CSS_BUILD: a bare `rails test` runs test:prepare,
      # which js/cssbundling-rails enhance with javascript:build/css:build —
      # on a bun-equipped runner that would silently rebuild the assets with
      # bun, overwriting the yarn-built ones from the Build Assets step. Both
      # gems check these env vars at rake load time and skip the enhancement,
      # so the manual yarn build above stays the only build path.
      - name: Run Tests
        env:
          POSTGRES_TEST_DB: wetrockpolice_test
          POSTGRES_USER: wrp
          POSTGRES_PASSWORD: dev
          POSTGRES_HOST: localhost
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SKIP_JS_BUILD: "1"
          SKIP_CSS_BUILD: "1"
        run: |
          bundle exec rails test

  # Images publish only for pushes to master, and only after the suite is
  # green. Previously this lived in build.yml and ran unconditionally, so a
  # failing branch still shipped an image to Docker Hub.
  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wetrockpolice:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
