version: '3.8'

services:
  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=dev
      - POSTGRES_USER=wrp
      - POSTGRES_DB=wetrockpolice_development
    ports:
      - '5432:5432'
    volumes:
      - wetrockpolice-postgres:/var/lib/postgresql/data:Z
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: Dockerfile.development
      args:
        RAILS_ENV: development
    # uncomment the following line to start a web server with a debugger
    # command: bundle exec rdebug-ide --debug --host 0.0.0.0 --port 1234 -- bin/rails server -p 3001 -b 0.0.0.0
    volumes:
      - .:/opt/wetrockpolice
      - /opt/wetrockpolice/tmp
      - /opt/wetrockpolice/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    env_file:
      - .env

  # Watches and rebuilds the esbuild + sass bundles into app/assets/builds,
  # which the web service serves via Propshaft (replaces webpack-dev-server).
  assets:
    build:
      context: .
      dockerfile: Dockerfile.development
      args:
        RAILS_ENV: development
    command: bash -c "yarn build --watch & exec yarn build:css --watch"
    volumes:
      - .:/opt/wetrockpolice
      - /opt/wetrockpolice/tmp
      - /opt/wetrockpolice/node_modules
    env_file:
      - .env

volumes:
  wetrockpolice-postgres: