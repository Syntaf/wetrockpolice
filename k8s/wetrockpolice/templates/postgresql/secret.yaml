# Same Secret name and key the Bitnami subchart used to generate, so the
# app deployment's WETROCKPOLICE_DATABASE_PASSWORD wiring is unchanged.
# The real password arrives via secrets.yaml (-f at deploy time).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wetrockpolice.postgresql.fullname" . }}
  labels:
    {{- include "wetrockpolice.postgresql.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.postgresql.auth.postgresPassword | b64enc }}
