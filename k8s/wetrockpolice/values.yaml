# Default values for wetrockpolice.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2
masterKey: rails-master-key
sendgrid:
  password: ''
# Placeholder — the real value MUST come from secrets.yaml at deploy
# time (see README "Deploying to Kubernetes"). Left empty, the app boots
# and passes its probes, but the weather proxy answers 503 and every
# landing page renders its weather-unavailable state.
synoptic:
  token: ''
image:
  repository: syntaf/wetrockpolice
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "27d4872db76918d047dd954cde7d600856bbba0e"
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations:
  external-dns.alpha.kubernetes.io/hostname: wetrockpolice.com
podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 3001
ingress:
  enabled: true
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod-wrp"
    nginx.org/server-snippets: |
      gzip on;
      gzip_types text/plain text/html application/json;

      server_name wetrockpolice.com www.wetrockpolice.com;

      if ($host = "www.wetrockpolice.com") {
        return 301 $scheme://wetrockpolice.com$request_uri;
      }
  hosts:
    - host: wetrockpolice.com
      paths:
        - /
  tls:
    - secretName: wetrockpolice-cert
      hosts:
        - 'wetrockpolice.com'
        - '*.wetrockpolice.com'
resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
nodeSelector:
  doks.digitalocean.com/node-pool: secondary
tolerations: []
affinity: {}
nginx-ingress:
  controller:
    ingressClass:
      name: "wetrockpolice-nginx"
    watchNamespace: "wetrockpolice"
    enableSnippets: true
    nodeSelector:
      doks.digitalocean.com/node-pool: secondary
external-dns:
  rbac:
    create: true
  namespaced: true
  # Ingress-only: the wetrockpolice.com record is served from the Ingress, and no
  # Service uses external-dns annotations. Omitting the default `service` source
  # avoids the cluster-scoped Node informer, which a namespaced Role cannot grant
  # (nodes are cluster-scoped) — that mismatch was crashlooping the pod.
  sources:
    - ingress
  provider:
    name: digitalocean
  env:
    - name: DO_TOKEN
      value: ""
  interval: "1m"
  policy: sync
  domainFilters: ['wetrockpolice.com']
  nodeSelector:
    doks.digitalocean.com/node-pool: secondary
# In-chart Postgres (templates/postgresql/): a single-replica StatefulSet
# on the official image, replacing the frozen Bitnami subchart. The value
# paths below (auth.*) intentionally match what secrets.yaml already sets.
postgresql:
  image:
    repository: postgres
    tag: "17"
  auth:
    username: wetrockpolice
    database: wetrockpolice_production
    # Placeholder — the real value comes from secrets.yaml at deploy time.
    # Written to the {{ .Release.Name }}-postgresql secret under the
    # `postgres-password` key, which both the postgres container and the
    # app pods (WETROCKPOLICE_DATABASE_PASSWORD) read.
    postgresPassword: my-postgresql-password
  persistence:
    size: 2Gi
    # Empty string = the cluster default (do-block-storage on DOKS).
    storageClass: ''
  primary:
    resources:
      requests:
        cpu: 125m
    nodeSelector:
      doks.digitalocean.com/node-pool: secondary
  # Optional weekly pg_dump CronJob to a small PVC. Off by default:
  # the data is reseedable (db/seeds.rb) and the owner accepts reseed
  # as the recovery path, so the extra volume is opt-in.
  backup:
    enabled: false
    schedule: '0 9 * * 0'
    size: 2Gi
    keepDays: 30
